# DevStack all-in-one — profil "lab léger" (8 Go RAM mini, 16 Go confortable)
# Services : Keystone, Nova, Glance, Neutron (OVN), Placement, Cinder (LVM)
[[local|localrc]]
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# Remplacé automatiquement par install.sh
HOST_IP=__HOST_IP__

# --- Économie de RAM ---
API_WORKERS=1
disable_service horizon
disable_service tempest
disable_service dstat
disable_service c-bak

# --- Cinder : backend LVM sur fichier ---
VOLUME_BACKING_FILE_SIZE=10G

# --- Réseau : plage flottante "public" ---
FLOATING_RANGE=172.24.4.0/24
PUBLIC_NETWORK_GATEWAY=172.24.4.1

# --- Image de test légère ---
DOWNLOAD_DEFAULT_IMAGES=True

# --- Logs ---
LOGFILE=$DEST/logs/stack.sh.log
LOG_COLOR=False

# >>> Si 16 Go ou plus : décommente pour avoir Horizon et plus de workers
# enable_service horizon
# API_WORKERS=2
LIBVIRT_TYPE=qemu
